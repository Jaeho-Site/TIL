<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="980" viewBox="0 0 1460 980" role="img" aria-labelledby="title desc">
  <title id="title">속성 조합 설계와 태그된 유니온 설계의 상태 공간 비교</title>
  <desc id="desc">불리언과 선택적 오류 속성의 조합이 무효 상태까지 허용하는 반면, 태그된 유니온은 세 가지 유효 상태만 표현함을 비교하는 다이어그램</desc>

  <defs>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#1c1f26" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1c1f26" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1460" height="980" fill="#f4f5f7"/>

  <!-- Left panel: property combinations -->
  <g aria-label="속성 조합 설계 패널">
    <rect x="48" y="44" width="660" height="716" rx="18" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5" filter="url(#panelShadow)"/>
    <rect x="48" y="44" width="8" height="716" rx="4" fill="#e74c3c"/>

    <text x="84" y="98" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="750">속성 조합 설계</text>
    <text x="84" y="139" fill="#6b7280" font-family="ui-monospace, Menlo, monospace" font-size="23">isLoading: boolean + error?: string</text>
    <line x1="84" y1="164" x2="672" y2="164" stroke="#d0d4dc" stroke-width="1.5"/>

    <!-- Column labels -->
    <text x="309" y="215" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="650">error 없음</text>
    <text x="554" y="215" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="650">error 있음</text>

    <!-- Row labels -->
    <text x="184" y="313" text-anchor="end" fill="#6b7280" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="650">
      <tspan x="184" dy="0">isLoading:</tspan>
      <tspan x="184" dy="28" fill="#6c5ce7">true</tspan>
    </text>
    <text x="184" y="503" text-anchor="end" fill="#6b7280" font-family="ui-monospace, Menlo, monospace" font-size="17" font-weight="650">
      <tspan x="184" dy="0">isLoading:</tspan>
      <tspan x="184" dy="28" fill="#6c5ce7">false</tspan>
    </text>

    <!-- 2x2 state grid -->
    <rect x="190" y="238" width="238" height="180" rx="12" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="309" cy="291" r="22" fill="#27ae60" opacity="0.13"/>
    <path d="M 309 277 A 14 14 0 1 1 297 284" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
    <circle cx="297" cy="284" r="3.5" fill="#27ae60"/>
    <text x="309" y="349" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">로딩 중</text>
    <text x="309" y="380" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">유효한 상태</text>

    <rect x="438" y="238" width="238" height="180" rx="12" fill="#fdecea" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="557" cy="280" r="19" fill="#e74c3c"/>
    <text x="557" y="288" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="800">!</text>
    <text x="557" y="329" text-anchor="middle" fill="#e74c3c" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="750">
      <tspan x="557" dy="0">로딩 중 + 에러??</tspan>
      <tspan x="557" dy="29">— 무효 상태도</tspan>
      <tspan x="557" dy="29">타입상 유효</tspan>
    </text>

    <rect x="190" y="428" width="238" height="180" rx="12" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="309" cy="481" r="22" fill="#27ae60"/>
    <path d="M 298 481 l 8 8 l 15 -18" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="309" y="539" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">성공 상태</text>
    <text x="309" y="570" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">유효한 상태</text>

    <rect x="438" y="428" width="238" height="180" rx="12" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="557" cy="481" r="22" fill="#27ae60" opacity="0.13"/>
    <path d="M 547 471 l 20 20 M 567 471 l -20 20" fill="none" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>
    <text x="557" y="539" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">에러 상태</text>
    <text x="557" y="570" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">유효한 상태</text>

    <!-- Left summary flow -->
    <rect x="84" y="645" width="588" height="76" rx="12" fill="#f4f5f7" stroke="#d0d4dc" stroke-width="1.2"/>
    <text x="111" y="691" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21">속성 조합</text>
    <line x1="218" y1="683" x2="270" y2="683" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="291" y="691" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">4개 상태</text>
    <line x1="395" y1="683" x2="447" y2="683" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="470" y="691" fill="#e74c3c" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="750">1개는 무효</text>
  </g>

  <!-- Right panel: tagged union -->
  <g aria-label="태그된 유니온 설계 패널">
    <rect x="732" y="44" width="680" height="716" rx="18" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5" filter="url(#panelShadow)"/>
    <rect x="732" y="44" width="8" height="716" rx="4" fill="#6c5ce7"/>

    <text x="768" y="98" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="34" font-weight="750">태그된 유니온 설계</text>
    <text x="768" y="139" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="23">state 태그가 상태를 열거</text>
    <line x1="768" y1="164" x2="1376" y2="164" stroke="#d0d4dc" stroke-width="1.5"/>

    <!-- State cards -->
    <rect x="768" y="201" width="394" height="112" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="768" y="201" width="7" height="112" rx="3.5" fill="#6c5ce7"/>
    <circle cx="810" cy="257" r="17" fill="#f3f0fd"/>
    <text x="810" y="263" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="800">1</text>
    <text x="843" y="266" fill="#1c1f26" font-family="ui-monospace, Menlo, monospace" font-size="20">
      <tspan fill="#1c1f26">{ </tspan><tspan fill="#6c5ce7" font-weight="750">state: 'pending'</tspan><tspan fill="#1c1f26"> }</tspan>
    </text>

    <rect x="768" y="329" width="394" height="112" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="768" y="329" width="7" height="112" rx="3.5" fill="#6c5ce7"/>
    <circle cx="810" cy="385" r="17" fill="#f3f0fd"/>
    <text x="810" y="391" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="800">2</text>
    <text x="843" y="394" fill="#1c1f26" font-family="ui-monospace, Menlo, monospace" font-size="20">
      <tspan fill="#1c1f26">{ </tspan><tspan fill="#6c5ce7" font-weight="750">state: 'error'</tspan><tspan fill="#1c1f26">, error }</tspan>
    </text>

    <rect x="768" y="457" width="394" height="112" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="768" y="457" width="7" height="112" rx="3.5" fill="#6c5ce7"/>
    <circle cx="810" cy="513" r="17" fill="#f3f0fd"/>
    <text x="810" y="519" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="19" font-weight="800">3</text>
    <text x="843" y="522" fill="#1c1f26" font-family="ui-monospace, Menlo, monospace" font-size="20">
      <tspan fill="#1c1f26">{ </tspan><tspan fill="#6c5ce7" font-weight="750">state: 'ok'</tspan><tspan fill="#1c1f26">, pageText }</tspan>
    </text>

    <!-- Side annotation -->
    <path d="M 1178 257 H 1192 M 1178 257 V 513 M 1178 385 H 1192 M 1178 513 H 1192" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
    <line x1="1192" y1="385" x2="1214" y2="385" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="1230" y="318" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="650">
      <tspan x="1230" dy="0">존재할 수 있는</tspan>
      <tspan x="1230" dy="32">상태가 딱 세 개</tspan>
      <tspan x="1230" dy="45" fill="#27ae60" font-weight="750">— 무효 조합은</tspan>
      <tspan x="1230" dy="32" fill="#27ae60" font-weight="750">표현 자체가</tspan>
      <tspan x="1230" dy="32" fill="#27ae60" font-weight="750">불가능</tspan>
    </text>

    <!-- Right summary flow -->
    <rect x="768" y="645" width="608" height="76" rx="12" fill="#f3f0fd" stroke="#d0d4dc" stroke-width="1.2"/>
    <text x="798" y="691" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21">state 태그</text>
    <line x1="902" y1="683" x2="958" y2="683" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="981" y="691" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">3개 상태</text>
    <line x1="1085" y1="683" x2="1141" y2="683" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
    <circle cx="1174" cy="683" r="18" fill="#27ae60"/>
    <path d="M 1166 683 l 6 6 l 11 -14" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1206" y="691" fill="#27ae60" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="750">모두 유효</text>
  </g>

  <!-- Full-width callout -->
  <g aria-label="핵심 원칙">
    <rect x="48" y="800" width="1364" height="132" rx="16" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="1.5" filter="url(#panelShadow)"/>
    <circle cx="112" cy="866" r="34" fill="#6c5ce7"/>
    <path d="M 99 866 l 9 9 l 18 -22" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="166" y="854" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="750">
      <tspan x="166" dy="0">좋은 타입 = 유효한 상태의 집합과</tspan>
      <tspan x="166" dy="38">타입이 표현하는 집합이 일치하는 타입</tspan>
    </text>
    <rect x="1048" y="832" width="314" height="68" rx="34" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
    <text x="1205" y="874" text-anchor="middle" fill="#6c5ce7" font-family="ui-monospace, Menlo, monospace" font-size="22" font-weight="750">유효 상태 ≡ 타입 상태</text>
  </g>
</svg>
