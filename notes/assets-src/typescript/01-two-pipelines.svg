<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">TypeScript 컴파일러의 두 독립 경로</title>
  <desc id="desc">app.ts 소스가 타입 체크와 트랜스파일이라는 서로 독립적인 두 경로로 처리되며, 타입 에러가 있어도 app.js가 생성될 수 있음을 보여주는 다이어그램</desc>

  <defs>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#6b7280"/>
    </marker>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1c1f26" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="940" fill="#f4f5f7"/>

  <!-- Source card -->
  <g filter="url(#card-shadow)">
    <rect x="470" y="55" width="500" height="150" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
    <rect x="470" y="55" width="10" height="150" rx="5" fill="#6c5ce7"/>
  </g>
  <text x="720" y="117" text-anchor="middle" fill="#1c1f26"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="36" font-weight="700">app.ts</text>
  <text x="720" y="161" text-anchor="middle" fill="#6b7280"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25">타입이 달린 소스 코드</text>

  <!-- Split arrows -->
  <g fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowhead)">
    <path d="M 720 205 L 720 245 L 370 245 L 370 295"/>
    <path d="M 720 205 L 720 245 L 1070 245 L 1070 295"/>
  </g>
  <circle cx="720" cy="245" r="7" fill="#6c5ce7"/>

  <!-- Main path cards -->
  <g filter="url(#card-shadow)">
    <rect x="100" y="310" width="540" height="180" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
    <rect x="800" y="310" width="540" height="180" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
  </g>

  <!-- Left: type checking -->
  <circle cx="160" cy="370" r="25" fill="#f3f0fd"/>
  <path d="M 148 370 L 157 379 L 174 360" fill="none" stroke="#6c5ce7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="379" fill="#1c1f26"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="35" font-weight="700">타입 체크</text>
  <text x="160" y="438" fill="#6b7280"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25">코드가 타입 규칙에 맞는지 검사</text>

  <!-- Right: transpilation -->
  <circle cx="860" cy="370" r="25" fill="#f3f0fd"/>
  <path d="M 849 361 L 838 370 L 849 379 M 871 361 L 882 370 L 871 379" fill="none" stroke="#6c5ce7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="900" y="379" fill="#1c1f26"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="35" font-weight="700">트랜스파일</text>
  <text x="860" y="438" fill="#6b7280"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="25">타입 구문 삭제 + 구버전 문법 변환</text>

  <!-- Independence divider -->
  <line x1="720" y1="300" x2="720" y2="710" stroke="#6c5ce7" stroke-width="3" stroke-dasharray="9 11"/>
  <rect x="603" y="474" width="234" height="68" rx="34" fill="#f4f5f7" stroke="#6c5ce7" stroke-width="2"/>
  <text x="720" y="517" text-anchor="middle" fill="#6c5ce7"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">서로 결과를 묻지 않는다</text>

  <!-- Result arrows -->
  <g fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)">
    <path d="M 370 490 L 370 575"/>
    <path d="M 1070 490 L 1070 575"/>
  </g>

  <!-- Result cards -->
  <g filter="url(#card-shadow)">
    <rect x="100" y="590" width="540" height="120" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
    <rect x="800" y="590" width="540" height="120" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
  </g>
  <rect x="100" y="590" width="8" height="120" rx="4" fill="#e74c3c"/>
  <rect x="800" y="590" width="8" height="120" rx="4" fill="#27ae60"/>

  <text x="370" y="662" text-anchor="middle" xml:space="preserve"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700"><tspan fill="#e74c3c">error TS2551&#160;</tspan><tspan fill="#1c1f26">에러 보고</tspan></text>
  <text x="1070" y="662" text-anchor="middle" xml:space="preserve"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700"><tspan fill="#27ae60">app.js&#160;</tspan><tspan fill="#1c1f26">생성</tspan></text>

  <!-- Bottom callout -->
  <rect x="80" y="780" width="1280" height="112" rx="12" fill="#f3f0fd" stroke="#d8d1f7" stroke-width="2"/>
  <circle cx="136" cy="836" r="25" fill="#6c5ce7"/>
  <text x="136" y="845" text-anchor="middle" fill="#ffffff"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="800">!</text>
  <text x="182" y="845" fill="#1c1f26"
        font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="26" font-weight="600">
    타입 에러가 있어도 app.js는 생성된다 — 막고 싶다면 <tspan fill="#6c5ce7" font-weight="800">noEmitOnError</tspan> 옵션
  </text>
</svg>
