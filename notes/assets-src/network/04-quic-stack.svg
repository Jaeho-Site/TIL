<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1000" viewBox="0 0 1460 1000" role="img" aria-labelledby="title desc">
  <title id="title">HTTP/3는 왜 UDP 위에 지어졌나</title>
  <desc id="desc">HTTP/2의 HTTP, TLS, TCP, IP 계층과 HTTP/3의 HTTP, QUIC, UDP, IP 계층을 비교해 전송 계층이 유저 영역으로 이동한 이유를 설명하는 프로토콜 스택 다이어그램</desc>

  <rect x="0" y="0" width="1460" height="1000" fill="#f4f5f7"/>

  <text x="50" y="66" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700">HTTP/3는 왜 UDP 위에 지어졌나</text>

  <!-- HTTP/2 stack card -->
  <rect x="50" y="100" width="520" height="740" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="90" y="153" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700">HTTP/2</text>
  <line x1="90" y1="174" x2="530" y2="174" stroke="#d0d4dc" stroke-width="1.5"/>

  <rect x="90" y="198" width="440" height="108" rx="12" fill="#ffffff" stroke="#6c5ce7" stroke-width="2"/>
  <text x="310" y="260" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">HTTP/2</text>

  <rect x="90" y="322" width="440" height="108" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="310" y="384" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">TLS</text>

  <rect x="90" y="446" width="440" height="148" rx="12" fill="#fdf6e3" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="310" y="503" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">TCP</text>
  <text x="310" y="545" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">커널에 구현 — 수정 불가</text>

  <rect x="90" y="610" width="440" height="108" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="310" y="672" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">IP</text>

  <!-- Direction of architectural change -->
  <text x="730" y="405" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">전송 계층을</text>
  <text x="730" y="438" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">유저 영역으로</text>
  <line x1="620" y1="486" x2="814" y2="486" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <path d="M814 466 L846 486 L814 506 Z" fill="#6b7280"/>

  <!-- HTTP/3 stack card -->
  <rect x="890" y="100" width="520" height="740" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="930" y="153" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="28" font-weight="700">HTTP/3</text>
  <line x1="930" y1="174" x2="1370" y2="174" stroke="#d0d4dc" stroke-width="1.5"/>

  <rect x="930" y="198" width="440" height="98" rx="12" fill="#ffffff" stroke="#6c5ce7" stroke-width="2"/>
  <text x="1150" y="255" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">HTTP/3</text>

  <rect x="930" y="312" width="440" height="196" rx="12" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="2"/>
  <text x="1150" y="366" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">QUIC</text>
  <text x="1150" y="411" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700">TLS 1.3 내장</text>
  <text x="1150" y="452" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">신뢰성·순서 보장을 유저 영역에서 직접 구현</text>

  <rect x="930" y="524" width="440" height="116" rx="12" fill="#eaf7ef" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="1150" y="568" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">UDP</text>
  <text x="1150" y="608" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">커널 통과용 최소 껍데기</text>

  <rect x="930" y="656" width="440" height="98" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="1150" y="713" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">IP</text>

  <!-- Summary callout -->
  <rect x="50" y="872" width="1360" height="88" rx="12" fill="#f3f0fd" stroke="#d0d4dc" stroke-width="1.5"/>
  <rect x="74" y="896" width="4" height="40" rx="2" fill="#6c5ce7"/>
  <text x="102" y="924" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">UDP가 아무것도 강제하지 않았기 때문에, 그 위에 무엇이든 새로 지을 수 있었다</text>
</svg>
