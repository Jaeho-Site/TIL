<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1200" viewBox="0 0 1480 1200" role="img" aria-labelledby="title desc">
  <title id="title">TLS 1.3 핸드셰이크 — 한 번의 왕복으로 끝나는 합의</title>
  <desc id="desc">브라우저와 서버가 한 번의 왕복으로 키를 합의하고 인증을 마친 뒤 대칭키로 HTTP를 암호화하는 TLS 1.3 시퀀스 다이어그램</desc>

  <rect x="0" y="0" width="1480" height="1200" fill="#f4f5f7"/>

  <text x="70" y="75" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700">TLS 1.3 핸드셰이크 — 한 번의 왕복으로 끝나는 합의</text>

  <rect x="70" y="108" width="1340" height="916" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>

  <!-- Participants -->
  <rect x="230" y="142" width="190" height="58" rx="12" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="2"/>
  <text x="325" y="179" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">브라우저</text>
  <rect x="935" y="142" width="190" height="58" rx="12" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="2"/>
  <text x="1030" y="179" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">서버</text>

  <line x1="325" y1="200" x2="325" y2="986" stroke="#d0d4dc" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="1030" y1="200" x2="1030" y2="986" stroke="#d0d4dc" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- TCP completion divider -->
  <line x1="108" y1="238" x2="1372" y2="238" stroke="#d0d4dc" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="534" y="218" width="412" height="40" rx="12" fill="#ffffff"/>
  <text x="740" y="245" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700">TCP 3-way 핸드셰이크 완료 후</text>

  <!-- ClientHello: browser to server -->
  <text x="677.5" y="293" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">ClientHello</text>
  <line x1="325" y1="316" x2="1013" y2="316" stroke="#6c5ce7" stroke-width="3" stroke-linecap="round"/>
  <path d="M1013 307 L1030 316 L1013 325 Z" fill="#6c5ce7"/>
  <text x="677.5" y="351" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">지원 암호 방식 목록 · 난수</text>
  <text x="677.5" y="378" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">Key Share (임시 공개키를 미리 전송)</text>

  <!-- ServerHello: server to browser -->
  <text x="677.5" y="433" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">ServerHello + Key Share</text>
  <line x1="1030" y1="456" x2="342" y2="456" stroke="#6c5ce7" stroke-width="3" stroke-linecap="round"/>
  <path d="M342 447 L325 456 L342 465 Z" fill="#6c5ce7"/>
  <text x="677.5" y="491" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">서버는 즉시 공유 비밀값 계산</text>

  <!-- 1-RTT bracket -->
  <path d="M1260 306 C1282 306 1288 319 1288 338 L1288 455 C1288 473 1298 483 1315 486 C1298 489 1288 499 1288 517 L1288 631 C1288 650 1282 663 1260 663" fill="none" stroke="#6c5ce7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1360" y="493" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">1-RTT</text>

  <!-- Encrypted server authentication flight -->
  <rect x="447" y="543" width="575" height="52" rx="12" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="2"/>
  <rect x="463" y="555" width="4" height="28" rx="2" fill="#6c5ce7"/>
  <text x="735" y="577" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">인증서 + CertificateVerify + Finished</text>
  <line x1="1030" y1="620" x2="342" y2="620" stroke="#6c5ce7" stroke-width="4" stroke-linecap="round"/>
  <path d="M342 610 L325 620 L342 630 Z" fill="#6c5ce7"/>
  <text x="677.5" y="657" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">여기서부터 이미 암호화되어 전송</text>

  <!-- Browser verification note -->
  <rect x="122" y="699" width="565" height="104" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <rect x="146" y="721" width="4" height="60" rx="2" fill="#6c5ce7"/>
  <text x="174" y="742" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">인증서 사슬 검증 → Root CA 도달 확인,</text>
  <text x="174" y="775" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">같은 세션키 계산</text>

  <!-- Browser Finished -->
  <text x="677.5" y="850" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">Finished</text>
  <line x1="325" y1="873" x2="1013" y2="873" stroke="#6c5ce7" stroke-width="3" stroke-linecap="round"/>
  <path d="M1013 864 L1030 873 L1013 882 Z" fill="#6c5ce7"/>

  <!-- Encrypted HTTP in both directions -->
  <text x="677.5" y="942" text-anchor="middle" fill="#27ae60" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">이후 모든 HTTP — 대칭키(세션키) 암호화</text>
  <line x1="342" y1="968" x2="1013" y2="968" stroke="#27ae60" stroke-width="4" stroke-linecap="round"/>
  <path d="M342 958 L325 968 L342 978 Z" fill="#27ae60"/>
  <path d="M1013 958 L1030 968 L1013 978 Z" fill="#27ae60"/>

  <!-- Summary callout -->
  <rect x="70" y="1052" width="1340" height="98" rx="12" fill="#f3f0fd" stroke="#d0d4dc" stroke-width="1.5"/>
  <rect x="70" y="1052" width="4" height="98" rx="2" fill="#6c5ce7"/>
  <text x="104" y="1110" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">비대칭키는 신원 확인과 키 합의에 한 번만 쓰고, 실제 대화는 전부 빠른 대칭키로 한다</text>
</svg>
