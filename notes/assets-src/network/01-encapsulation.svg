<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="980" viewBox="0 0 1460 980" role="img" aria-labelledby="title desc">
  <title id="title">캡슐화 — 계층을 내려갈 때마다 포장이 늘어난다</title>
  <desc id="desc">TCP/IP 데이터가 응용 계층에서 데이터 링크 계층으로 내려가며 TCP, IP, MAC 헤더와 FCS로 캡슐화되는 과정을 보여주는 다이어그램</desc>

  <rect x="0" y="0" width="1460" height="980" fill="#f4f5f7"/>

  <text x="60" y="68" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700">캡슐화 — 계층을 내려갈 때마다 포장이 늘어난다</text>

  <!-- L7 -->
  <rect x="50" y="105" width="1360" height="150" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <line x1="390" y1="125" x2="390" y2="235" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="78" y="166" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">
    <tspan x="78" dy="0">L7 응용 계층 ·</tspan>
    <tspan x="78" dy="32">스트림(Stream)</tspan>
  </text>
  <rect x="1030" y="136" width="250" height="88" rx="8" fill="#ffffff" stroke="#6c5ce7" stroke-width="2.5"/>
  <text x="1155" y="187" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">데이터 (HTTP 요청)</text>

  <!-- Arrow 1 -->
  <line x1="905" y1="264" x2="905" y2="282" stroke="#6b7280" stroke-width="2"/>
  <path d="M897 278 L905 286 L913 278" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- L4 -->
  <rect x="50" y="295" width="1360" height="150" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <line x1="390" y1="315" x2="390" y2="425" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="78" y="356" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">
    <tspan x="78" dy="0">L4 전송 계층 ·</tspan>
    <tspan x="78" dy="32">세그먼트(Segment)</tspan>
  </text>
  <rect x="790" y="326" width="240" height="88" rx="8" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="910" y="354" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">TCP 헤더</text>
  <text x="910" y="379" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17">
    <tspan x="910" dy="0">출발지·목적지 포트,</tspan>
    <tspan x="910" dy="22">순서 번호</tspan>
  </text>
  <rect x="1030" y="326" width="250" height="88" rx="8" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="1155" y="377" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">데이터</text>

  <!-- Arrow 2 -->
  <line x1="905" y1="454" x2="905" y2="472" stroke="#6b7280" stroke-width="2"/>
  <path d="M897 468 L905 476 L913 468" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- L3 -->
  <rect x="50" y="485" width="1360" height="150" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <line x1="390" y1="505" x2="390" y2="615" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="78" y="546" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">
    <tspan x="78" dy="0">L3 네트워크 계층 ·</tspan>
    <tspan x="78" dy="32">패킷(Packet)</tspan>
  </text>
  <rect x="600" y="516" width="190" height="88" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="695" y="549" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">IP 헤더</text>
  <text x="695" y="580" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17">출발지·목적지 IP</text>
  <rect x="790" y="516" width="240" height="88" rx="8" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="910" y="567" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">TCP 헤더</text>
  <rect x="1030" y="516" width="250" height="88" rx="8" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="1155" y="567" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">데이터</text>

  <!-- Arrow 3 -->
  <line x1="905" y1="644" x2="905" y2="662" stroke="#6b7280" stroke-width="2"/>
  <path d="M897 658 L905 666 L913 658" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- L2 -->
  <rect x="50" y="675" width="1360" height="150" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <line x1="390" y1="695" x2="390" y2="805" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="78" y="736" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">
    <tspan x="78" dy="0">L2 데이터 링크 계층 ·</tspan>
    <tspan x="78" dy="32">프레임(Frame)</tspan>
  </text>
  <rect x="420" y="706" width="180" height="88" rx="8" fill="#fdf6e3" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="510" y="734" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">MAC 헤더</text>
  <text x="510" y="759" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17">
    <tspan x="510" dy="0">다음 장비의</tspan>
    <tspan x="510" dy="22">MAC 주소</tspan>
  </text>
  <rect x="600" y="706" width="190" height="88" rx="8" fill="#eaf7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="695" y="757" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">IP 헤더</text>
  <rect x="790" y="706" width="240" height="88" rx="8" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="910" y="757" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">TCP 헤더</text>
  <rect x="1030" y="706" width="250" height="88" rx="8" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="1155" y="757" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">데이터</text>
  <rect x="1280" y="706" width="100" height="88" rx="8" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="1330" y="742" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">FCS</text>
  <text x="1330" y="770" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17">오류 검출</text>

  <!-- Summary callout -->
  <rect x="50" y="860" width="1360" height="78" rx="12" fill="#f3f0fd" stroke="#d0d4dc" stroke-width="1.5"/>
  <rect x="74" y="879" width="4" height="40" rx="2" fill="#6c5ce7"/>
  <text x="102" y="907" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">계층을 내려갈 때마다 그 계층의 주소가 헤더로 덧붙고, 수신 측은 역순으로 벗겨낸다</text>
</svg>
