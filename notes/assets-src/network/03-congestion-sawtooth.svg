<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1000" viewBox="0 0 1460 1000" role="img" aria-labelledby="title desc">
  <title id="title">혼잡 윈도우는 톱니를 그리며 적정선을 더듬는다</title>
  <desc id="desc">TCP 혼잡 윈도우가 슬로우 스타트로 빠르게 증가하고, 혼잡 회피에서 완만히 증가한 뒤, 3중복 ACK와 타임아웃에 따라 서로 다른 크기로 감소하는 과정을 나타낸 그래프</desc>

  <rect x="0" y="0" width="1460" height="1000" fill="#f4f5f7"/>

  <text x="50" y="66" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700">혼잡 윈도우는 톱니를 그리며 적정선을 더듬는다</text>

  <!-- Main graph card -->
  <rect x="50" y="100" width="1360" height="750" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>

  <!-- Reference lines -->
  <line x1="180" y1="415" x2="1340" y2="415" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 8"/>
  <rect x="1174" y="389" width="154" height="32" rx="12" fill="#ffffff"/>
  <text x="1326" y="412" text-anchor="end" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700">ssthresh = 16</text>

  <line x1="180" y1="495" x2="1340" y2="495" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8 8"/>
  <rect x="1212" y="469" width="116" height="32" rx="12" fill="#ffffff"/>
  <text x="1326" y="492" text-anchor="end" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700">12 (절반)</text>

  <!-- Axes -->
  <line x1="180" y1="190" x2="180" y2="735" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <line x1="180" y1="735" x2="1340" y2="735" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
  <text x="760" y="800" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">시간 (RTT)</text>
  <text x="103" y="463" text-anchor="middle" transform="rotate(-90 103 463)" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">혼잡 윈도우 cwnd (MSS)</text>

  <!-- Phase labels -->
  <text x="220" y="247" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">슬로우 스타트 — RTT마다 2배</text>
  <text x="465" y="323" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">혼잡 회피 — RTT마다 +1</text>

  <!-- Congestion window: exponential growth, additive growth, and multiplicative drops -->
  <path d="M210 715
           C224 714 239 708 250 695
           C265 684 280 670 290 655
           C307 634 321 604 330 575
           C349 531 365 467 380 415
           L760 255
           L760 495
           L1080 335
           L1080 715
           C1102 713 1122 703 1138 685
           C1160 660 1180 610 1200 535
           L1300 493"
        fill="none" stroke="#6c5ce7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Loss events -->
  <circle cx="760" cy="255" r="9" fill="#e74c3c" stroke="#ffffff" stroke-width="3"/>
  <line x1="760" y1="244" x2="760" y2="220" stroke="#e74c3c" stroke-width="2"/>
  <text x="780" y="210" fill="#e74c3c" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700">3중복 ACK — 절반으로 (빠른 회복)</text>

  <circle cx="1080" cy="335" r="9" fill="#e74c3c" stroke="#ffffff" stroke-width="3"/>
  <line x1="1080" y1="324" x2="1080" y2="300" stroke="#e74c3c" stroke-width="2"/>
  <text x="1080" y="290" text-anchor="end" fill="#e74c3c" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="700">타임아웃 — 1부터 다시 (슬로우 스타트)</text>

  <!-- Summary callout -->
  <rect x="50" y="882" width="1360" height="78" rx="12" fill="#f3f0fd" stroke="#d0d4dc" stroke-width="1.5"/>
  <rect x="74" y="901" width="4" height="40" rx="2" fill="#6c5ce7"/>
  <text x="102" y="929" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">조금씩 늘리고 한 번에 확 줄인다(AIMD) — 유실의 종류에 따라 되돌아가는 위치가 다르다</text>
</svg>
