<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">https://ezilog.dev 엔터 — 그 후의 여정</title>
  <desc id="svg-desc">DNS 조회부터 렌더링 시작까지, URL 입력 뒤 이어지는 여섯 단계의 지그재그 여정 지도</desc>

  <defs>
    <marker id="arrowhead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 7 L 1 13 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1100" fill="#f4f5f7"/>

  <text x="750" y="66" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="32" font-weight="700">https://ezilog.dev 엔터 — 그 후의 여정</text>
  <text x="750" y="101" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">URL 입력부터 브라우저 렌더링 직전까지</text>

  <!-- 카드 1: DNS 조회 -->
  <rect x="100" y="150" width="600" height="160" rx="12" fill="#ffffff" stroke="#6c5ce7" stroke-width="3"/>
  <circle cx="148" cy="198" r="27" fill="#6c5ce7"/>
  <text x="148" y="206" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">①</text>
  <text x="190" y="206" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">DNS 조회</text>
  <line x1="124" y1="232" x2="676" y2="232" stroke="#d0d4dc" stroke-width="1"/>
  <text x="124" y="270" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">캐시 3단 확인 후, 리졸버가 루트→TLD→권한 서버 탐색</text>

  <!-- 카드 2: TCP 핸드셰이크 -->
  <rect x="800" y="150" width="600" height="160" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
  <circle cx="848" cy="198" r="27" fill="#ffffff" stroke="#6c5ce7" stroke-width="2"/>
  <text x="848" y="206" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">②</text>
  <text x="890" y="206" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">TCP 3-way 핸드셰이크</text>
  <line x1="824" y1="232" x2="1376" y2="232" stroke="#d0d4dc" stroke-width="1"/>
  <text x="824" y="270" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">SYN · SYN+ACK · ACK — 순서 번호 합의</text>

  <!-- 카드 3: TLS 핸드셰이크 -->
  <rect x="800" y="400" width="600" height="160" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
  <circle cx="848" cy="448" r="27" fill="#ffffff" stroke="#6c5ce7" stroke-width="2"/>
  <text x="848" y="456" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">③</text>
  <text x="890" y="456" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">TLS 핸드셰이크</text>
  <line x1="824" y1="482" x2="1376" y2="482" stroke="#d0d4dc" stroke-width="1"/>
  <text x="824" y="520" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">인증서 검증 + 세션키 합의 (1-RTT)</text>

  <!-- 카드 4: HTTP 요청 -->
  <rect x="100" y="400" width="600" height="160" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
  <circle cx="148" cy="448" r="27" fill="#ffffff" stroke="#6c5ce7" stroke-width="2"/>
  <text x="148" y="456" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">④</text>
  <text x="190" y="456" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">HTTP 요청</text>
  <line x1="124" y1="482" x2="676" y2="482" stroke="#d0d4dc" stroke-width="1"/>
  <text x="124" y="520" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">GET / — 헤더와 쿠키 자동 첨부 (캐시가 신선했다면 여정 자체가 없다)</text>

  <!-- 카드 5: 응답과 후속 리소스 -->
  <rect x="100" y="650" width="600" height="160" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="2"/>
  <circle cx="148" cy="698" r="27" fill="#ffffff" stroke="#6c5ce7" stroke-width="2"/>
  <text x="148" y="706" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">⑤</text>
  <text x="190" y="706" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">응답과 후속 리소스</text>
  <line x1="124" y1="732" x2="676" y2="732" stroke="#d0d4dc" stroke-width="1"/>
  <text x="124" y="770" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">200 + HTML → CSS·JS·이미지 멀티플렉싱 병렬 수신</text>

  <!-- 카드 6: 렌더링 시작 -->
  <rect x="800" y="650" width="600" height="160" rx="12" fill="#eaf7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="848" cy="698" r="27" fill="#27ae60"/>
  <text x="848" y="706" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="24" font-weight="700">⑥</text>
  <text x="890" y="706" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="22" font-weight="700">렌더링 시작</text>
  <line x1="824" y1="732" x2="1376" y2="732" stroke="#b9dcc6" stroke-width="1"/>
  <text x="824" y="770" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18">여기부터는 브라우저의 영역 — DOM · CSSOM · 렌더 트리</text>

  <!-- 지그재그 연결 화살표 -->
  <path d="M 714 230 L 786 230" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M 1100 324 L 1100 386" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M 786 480 L 714 480" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M 400 574 L 400 636" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>
  <path d="M 714 730 L 786 730" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead)"/>

  <!-- 단계 묶음: 대화의 준비 -->
  <path d="M 1448 150 L 1464 150 M 1464 150 L 1464 560 M 1448 560 L 1464 560" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="1485" y="355" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="600" transform="rotate(90 1485 355)">대화의 준비 (왕복 비용)</text>

  <!-- 단계 묶음: 실제 대화 -->
  <path d="M 52 400 L 36 400 M 36 400 L 36 810 M 52 810 L 36 810" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="18" y="605" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="18" font-weight="600" transform="rotate(-90 18 605)">실제 대화</text>

  <!-- 하단 요약 콜아웃 -->
  <rect x="100" y="910" width="1300" height="112" rx="12" fill="#f3f0fd" stroke="#d0d4dc" stroke-width="1"/>
  <rect x="100" y="910" width="4" height="112" rx="2" fill="#6c5ce7"/>
  <circle cx="154" cy="966" r="20" fill="#ffffff" stroke="#6c5ce7" stroke-width="2"/>
  <text x="154" y="973" text-anchor="middle" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">!</text>
  <text x="194" y="974" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="600">여정의 절반은 대화가 아니라 준비다 — 네트워크 최적화는 결국 이 왕복을 세고 지우는 일이다</text>
</svg>
