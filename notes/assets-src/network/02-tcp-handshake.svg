<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="960" viewBox="0 0 1460 960" role="img" aria-labelledby="title desc">
  <title id="title">TCP 연결 수립과 종료 핸드셰이크</title>
  <desc id="desc">클라이언트와 서버 사이의 TCP 3-way 연결 수립 및 4-way 연결 종료 과정을 시간 순서대로 비교하는 시퀀스 다이어그램</desc>

  <rect x="0" y="0" width="1460" height="960" fill="#f4f5f7"/>

  <!-- Connection establishment panel -->
  <rect x="50" y="40" width="660" height="770" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="82" y="88" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700">연결 수립 — 3-way 핸드셰이크</text>
  <line x1="82" y1="110" x2="678" y2="110" stroke="#d0d4dc" stroke-width="1.5"/>

  <rect x="105" y="136" width="150" height="52" rx="12" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="180" y="170" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">클라이언트</text>
  <rect x="505" y="136" width="150" height="52" rx="12" fill="#f3f0fd" stroke="#6c5ce7" stroke-width="1.5"/>
  <text x="580" y="170" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">서버</text>

  <line x1="180" y1="188" x2="180" y2="762" stroke="#d0d4dc" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="580" y1="188" x2="580" y2="762" stroke="#d0d4dc" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- SYN -->
  <text x="380" y="237" text-anchor="middle" xml:space="preserve" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">SYN  seq=3000</text>
  <line x1="180" y1="258" x2="566" y2="258" stroke="#6c5ce7" stroke-width="3" stroke-linecap="round"/>
  <path d="M566 250 L580 258 L566 266 Z" fill="#6c5ce7"/>

  <text x="198" y="307" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17">SYN_SENT</text>
  <text x="562" y="307" text-anchor="end" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17">SYN_RECEIVED</text>

  <!-- SYN + ACK -->
  <text x="380" y="377" text-anchor="middle" xml:space="preserve" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">SYN+ACK  seq=5000, ack=3001</text>
  <line x1="580" y1="398" x2="194" y2="398" stroke="#6c5ce7" stroke-width="3" stroke-linecap="round"/>
  <path d="M194 390 L180 398 L194 406 Z" fill="#6c5ce7"/>

  <!-- ACK -->
  <text x="380" y="517" text-anchor="middle" xml:space="preserve" fill="#6c5ce7" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">ACK  ack=5001</text>
  <line x1="180" y1="538" x2="566" y2="538" stroke="#6c5ce7" stroke-width="3" stroke-linecap="round"/>
  <path d="M566 530 L580 538 L566 546 Z" fill="#6c5ce7"/>

  <text x="198" y="592" fill="#27ae60" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700">ESTABLISHED</text>
  <text x="562" y="592" text-anchor="end" fill="#27ae60" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700">ESTABLISHED</text>

  <!-- Connection termination panel -->
  <rect x="750" y="40" width="660" height="770" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="782" y="88" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="30" font-weight="700">연결 종료 — 4-way 핸드셰이크</text>
  <line x1="782" y1="110" x2="1378" y2="110" stroke="#d0d4dc" stroke-width="1.5"/>

  <rect x="805" y="136" width="150" height="52" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="880" y="170" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">클라이언트</text>
  <rect x="1205" y="136" width="150" height="52" rx="12" fill="#ffffff" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="1280" y="170" text-anchor="middle" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">서버</text>

  <line x1="880" y1="188" x2="880" y2="762" stroke="#d0d4dc" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="1280" y1="188" x2="1280" y2="762" stroke="#d0d4dc" stroke-width="2" stroke-dasharray="7 7"/>

  <!-- FIN -->
  <text x="1080" y="227" text-anchor="middle" fill="#e74c3c" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">FIN</text>
  <line x1="880" y1="248" x2="1266" y2="248" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <path d="M1266 240 L1280 248 L1266 256 Z" fill="#e74c3c"/>

  <!-- ACK -->
  <text x="1080" y="327" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">ACK</text>
  <line x1="1280" y1="348" x2="894" y2="348" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <path d="M894 340 L880 348 L894 356 Z" fill="#6b7280"/>

  <text x="898" y="393" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17">FIN_WAIT_2</text>
  <text x="1262" y="393" text-anchor="end" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17">CLOSE_WAIT</text>

  <!-- Remaining server data interval -->
  <line x1="1280" y1="418" x2="1280" y2="510" stroke="#6b7280" stroke-width="3" stroke-dasharray="4 7" stroke-linecap="round"/>
  <rect x="1068" y="438" width="188" height="42" rx="12" fill="#f4f5f7" stroke="#d0d4dc" stroke-width="1.5"/>
  <text x="1162" y="466" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700">남은 데이터 전송</text>

  <!-- FIN -->
  <text x="1080" y="547" text-anchor="middle" fill="#e74c3c" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">FIN</text>
  <line x1="1280" y1="568" x2="894" y2="568" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <path d="M894 560 L880 568 L894 576 Z" fill="#e74c3c"/>

  <!-- Final ACK -->
  <text x="1080" y="647" text-anchor="middle" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="20" font-weight="700">ACK</text>
  <line x1="880" y1="668" x2="1266" y2="668" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <path d="M1266 660 L1280 668 L1266 676 Z" fill="#6b7280"/>

  <text x="898" y="724" fill="#e74c3c" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700">TIME_WAIT (2MSL 대기)</text>
  <text x="1262" y="724" text-anchor="end" fill="#6b7280" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="17" font-weight="700">CLOSED</text>

  <!-- Summary callout -->
  <rect x="50" y="842" width="1360" height="78" rx="12" fill="#f3f0fd" stroke="#d0d4dc" stroke-width="1.5"/>
  <rect x="74" y="861" width="4" height="40" rx="2" fill="#6c5ce7"/>
  <text x="102" y="889" fill="#1c1f26" font-family="-apple-system, 'Apple SD Gothic Neo', sans-serif" font-size="21" font-weight="700">시작 인사는 동시에 할 수 있어 세 번이면 되지만, 끝맺음은 서로의 사정이 달라 네 번이 필요하다</text>
</svg>
